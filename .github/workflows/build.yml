name: Build App (iOS IPA e Android APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Criar arquivo .env vazio
        run: touch .env

      - name: Build iOS (sem codesign)
        run: flutter build ios --release --no-codesign --dart-define=BASE_URL=${{ vars.API_BASE_URL }}
        env:
          CODE_SIGNING_ALLOWED: 'NO'
          CODE_SIGN_IDENTITY: ''
          CODE_SIGNING_REQUIRED: 'NO'
        continue-on-error: true

      - name: Recompilar com xcodebuild direto (fallback)
        run: |
          if [ ! -d "build/ios/iphoneos/Runner.app" ] && [ ! -d "build/ios/Release-iphoneos/Runner.app" ]; then
            cd ios
            pod install
            xcodebuild \
              -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              PROVISIONING_PROFILE="" \
              DEVELOPMENT_TEAM="" \
              clean build \
              FLUTTER_BUILD_DIR=../build \
              OBJROOT=../build/ios \
              SYMROOT=../build/ios
          fi

      - name: Criar IPA manualmente
        run: |
          APP_PATH=$(find build/ios -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erro: Runner.app não encontrado"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r app.ipa Payload

      - name: Upload IPA como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: app.ipa

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Criar arquivo .env vazio
        run: touch .env

      - name: Build Android APK
        run: flutter build apk --release --dart-define=BASE_URL=${{ vars.API_BASE_URL }} --android-skip-build-dependency-validation

      - name: Upload APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
